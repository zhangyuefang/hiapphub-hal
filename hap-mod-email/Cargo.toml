[package]
name = "hap-mod-email"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hap-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
mail-parser = "0.9"
imap = { version = "2", default-features = false }
rustls = { workspace = true }
webpki-roots = "0.26"
